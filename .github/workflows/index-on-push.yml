# Example: put this in each application repo (or a central repo with repository_dispatch).
# On push to main it (1) tells the ingest service to re-sync docs and (2) triggers a graph re-index.
name: index-on-push
on:
  push:
    branches: [main]
jobs:
  notify-stack:
    runs-on: [self-hosted]   # must reach the stack's network
    steps:
      - name: Re-ingest docs into LightRAG
        run: |
          curl -fsS -X POST "$INGEST_URL/webhook/git" \
            -H "X-Ingest-Secret: $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"repo\": \"${{ github.server_url }}/${{ github.repository }}.git\"}"
        env:
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_WEBHOOK_SECRET }}
      - name: Re-index code graph
        run: |
          # SCOPE = the scope this repo is listed under in config/scopes.yaml
          docker compose -f /opt/agent-context-stack/compose.yaml -f /opt/agent-context-stack/compose.scopes.yaml \
            --profile jobs run --rm "indexer-${{ vars.SCOPE }}" "${{ github.server_url }}/${{ github.repository }}.git"
