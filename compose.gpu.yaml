# NVIDIA GPU override: docker compose -f compose.yaml -f compose.gpu.yaml up -d
# Requires nvidia-container-toolkit. On Kubernetes use the NVIDIA device plugin (see k8s/base/ollama.yaml).
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
