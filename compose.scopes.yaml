services:
  lightrag-public:
    image: ghcr.io/hkuds/lightrag:v1.5.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: '9621'
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      LLM_BINDING: ${LLM_PROVIDER:-ollama}
      LLM_BINDING_HOST: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_BINDING_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL}
      OLLAMA_LLM_NUM_CTX: '32768'
      EMBEDDING_BINDING: ${EMBED_PROVIDER:-ollama}
      EMBEDDING_BINDING_HOST: ${EMBED_BASE_URL:-http://ollama:11434}
      EMBEDDING_BINDING_API_KEY: ${EMBED_API_KEY:-ollama}
      EMBEDDING_MODEL: ${EMBED_MODEL}
      EMBEDDING_DIM: ${EMBED_DIM}
      LLM_TIMEOUT: '600'
      MAX_PARALLEL_INSERT: '2'
      WHITELIST_PATHS: /health
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      LIGHTRAG_GRAPH_STORAGE: PGTableGraphStorage
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: lightrag
      POSTGRES_VECTOR_INDEX_TYPE: HNSW
      WORKSPACE: scope_public
    volumes:
    - lightrag_public:/app/data
  falkordb-public:
    image: docker.io/falkordb/falkordb:v4.20.4
    restart: unless-stopped
    volumes:
    - falkordb_public:/var/lib/falkordb/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - PING
      interval: 10s
      timeout: 5s
      retries: 10
  codegraph-public:
    build: ./mcp/codegraph-mcp
    restart: unless-stopped
    depends_on:
      falkordb-public:
        condition: service_healthy
    environment:
      DEFAULT_DATABASE: falkordb-remote
      FALKORDB_HOST: falkordb-public
      FALKORDB_PORT: '6379'
    volumes:
    - repos_public:/workspace:ro
    - cgc_public:/home/cgc/.codegraphcontext
  indexer-public:
    build: ./mcp/codegraph-mcp
    profiles:
    - jobs
    depends_on:
      falkordb-public:
        condition: service_healthy
    environment:
      DEFAULT_DATABASE: falkordb-remote
      FALKORDB_HOST: falkordb-public
      FALKORDB_PORT: '6379'
      GIT_DOC_REPOS: https://github.com/your-org/platform-docs.git,https://github.com/your-org/shared-libs.git
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
    - repos_public:/workspace
    - cgc_public:/home/cgc/.codegraphcontext
    - ./index/index-repo.sh:/usr/local/bin/index-repo.sh:ro
    entrypoint:
    - /bin/bash
