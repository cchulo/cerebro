# Access scopes = the ONE isolation unit for documents AND code.
# A scope names the IdP groups allowed to read it, the code it covers and the documents it covers. A repo, space or
# project belongs to exactly one scope. A user can use a scope only if they are in one of its groups; that single
# decision drives query_docs, live_search/live_fetch, search_code and code_graph alike.
#
# Per scope the stack runs its own LightRAG (docs graph) and its own FalkorDB + CodeGraphContext (code graph).
# Sourcebot stays a single instance; the gateway restricts every search to the repos of the caller's scopes.
#
# Everything that reads a source is ONE plugin file under plugins/ (docs/PLUGINS.md); nothing is built in. A plugin can
# carry an ingest part (referenced by name under a scope's `docs:`), a live-fallback part (used automatically when the
# scope's index has no answer) and the MCP upstream image that fallback needs (run as `mcp-<plugin>` by `make gen`).
# The values below are a working example: public GitHub repos and the fixture spaces served by the test environment.

identity:
  user_header: X-Forwarded-User        # set by oauth2-proxy / Authelia / Caddy OIDC
  groups_header: X-Forwarded-Groups    # comma-separated group names
  always_groups: [everyone]
  team_banks_from_groups: true         # group "payments-team" -> shared Hindsight bank "team-payments-team"

# Non-secret options for ingest adapters (secrets stay in config/stack.env). Optional; adapters need no declaration.
#   jama: { url: https://jama.internal, page_size: 100 }
sources: {}

# Live fallbacks are declared by the plugins themselves and enabled whenever a plugin ships a live part. This optional
# map only overrides per plugin: { enabled: false } | { fallback: false } (explicit live_search only) | { via: rest }
# (skip the upstream MCP) | { url: ..., auth_env: ... } (an upstream you run elsewhere).
live: {}

scopes:
  public:
    groups: [everyone]
    code:                              # Sourcebot search, CodeGraphContext graph, and the `git` docs plugin
      repos:
        - https://github.com/pallets/click.git
        - https://github.com/pallets/flask.git
    docs:                              # adapter name -> what of that source belongs to this scope
      confluence: { spaces: [ENG, DOCS] }
      backstage: {}                    # whole catalog (org-wide metadata)
      git: { globs: [README.md, "docs/**/*.md", "docs/**/*.rst"] }
      files: { paths: [/data/docs/public] }

  payments:
    groups: [payments-team, platform-leads]
    code:
      repos:
        - https://github.com/pallets/jinja.git
    docs:
      confluence: { spaces: [PAY] }
      git: {}
      jama: { projects: [42] }         # requirements + test cases of the payments project

  infra:
    groups: [sre, platform-leads]
    code:
      repos:
        - https://github.com/pallets/werkzeug.git
    docs:
      confluence: { spaces: [OPS] }
      git: {}
      files: { paths: [/data/docs/infra] }
      jama: { projects: [57] }
