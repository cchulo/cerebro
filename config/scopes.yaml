# Access scopes = the isolation unit for documents AND code.
# A document or repo is indexed into exactly one scope. A user can query a scope only if they are in one of its groups.
# Groups come from your IdP via the reverse proxy (X-Forwarded-Groups); "everyone" is granted to all authenticated users.
#
# Each scope gets its own LightRAG instance (docs graph) and its own FalkorDB + CodeGraphContext (code graph).
# Sourcebot stays a single instance; the gateway restricts searches to the repos of the caller's scopes.

identity:
  user_header: X-Forwarded-User        # set by oauth2-proxy / Authelia / Caddy OIDC
  groups_header: X-Forwarded-Groups    # comma-separated group names
  always_groups: [everyone]
  team_banks_from_groups: true         # group "payments-team" -> shared Hindsight bank "team-payments-team"

restricted_pages: skip                 # Confluence pages with read restrictions: skip | own_scope
                                       # own_scope = index into scope named "restricted-<pageid>" (rarely useful)

scopes:
  public:
    groups: [everyone]
    confluence_spaces: [ENG, DOCS]
    backstage: true
    repos:
      - https://github.com/your-org/platform-docs.git
      - https://github.com/your-org/shared-libs.git

  payments:
    groups: [payments-team, platform-leads]
    confluence_spaces: [PAY]
    repos:
      - https://github.com/your-org/payments.git
      - https://github.com/your-org/ledger.git

  infra:
    groups: [sre, platform-leads]
    confluence_spaces: [OPS]
    repos:
      - https://github.com/your-org/infra.git
