# Access scopes = the isolation unit for documents AND code.
# A document or repo is indexed into exactly one scope. A user can query a scope only if they are in one of its groups.
# Groups come from your IdP via the reverse proxy (X-Forwarded-Groups); "everyone" is granted to all authenticated users.
#
# Each scope gets its own LightRAG instance (docs graph) and its own FalkorDB + CodeGraphContext (code graph).
# Sourcebot stays a single instance; the gateway restricts searches to the repos of the caller's scopes.
#
# The values below are a working example: public GitHub repos and the fixture spaces served by compose.test.yaml.

identity:
  user_header: X-Forwarded-User        # set by oauth2-proxy / Authelia / Caddy OIDC
  groups_header: X-Forwarded-Groups    # comma-separated group names
  always_groups: [everyone]
  team_banks_from_groups: true         # group "payments-team" -> shared Hindsight bank "team-payments-team"

# Document source adapters. Built-ins: confluence, backstage, git, files. Any *.py dropped into plugins/ (see
# plugins/README.md, plugins/jama.py) or any installed package with a `context_stack.sources` entry point adds more,
# with no declaration here. This optional map only carries non-secret adapter options (secrets stay in stack.env):
#   jama: { url: https://jama.internal, page_size: 100 }
sources: {}

scopes:
  public:
    groups: [everyone]
    repos:                             # code -> Sourcebot + CodeGraphContext; docs inside them -> `git` adapter
      - https://github.com/pallets/click.git
      - https://github.com/pallets/flask.git
    docs:                              # document sources -> this scope's LightRAG (adapter name -> its config)
      confluence: { spaces: [ENG, DOCS] }
      backstage: {}                    # whole catalog (org-wide metadata)
      git: { globs: [README.md, "docs/**/*.md", "docs/**/*.rst"] }
      files: { paths: [/data/docs/public] }

  payments:
    groups: [payments-team, platform-leads]
    repos:
      - https://github.com/pallets/jinja.git
    docs:
      confluence: { spaces: [PAY] }
      git: {}

  infra:
    groups: [sre, platform-leads]
    repos:
      - https://github.com/pallets/werkzeug.git
    docs:
      confluence: { spaces: [OPS] }
      git: {}
      files: { paths: [/data/docs/infra] }
