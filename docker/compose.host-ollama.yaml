# Use an Ollama that already runs on the host (Apple silicon / a GPU box outside Docker) instead of the ollama
# container. Docker Desktop and OrbStack resolve host.docker.internal.
#
# In config/stack.env:   LLM_BASE_URL=http://host.docker.internal:11434
#            EMBED_BASE_URL=http://host.docker.internal:11434
#            HINDSIGHT_EMBED_BASE_URL=http://host.docker.internal:11434/v1
# Then:      make up EXTRA="-f docker/compose.host-ollama.yaml"
# Pull models on the host instead of scripts/pull-models.sh:  ollama pull bge-m3 && ollama pull $LLM_MODEL
# Let the host Ollama serve several requests at once, or queries queue behind ingest (macOS app: launchctl setenv
# OLLAMA_NUM_PARALLEL 4, then quit and reopen Ollama; systemd: Environment=OLLAMA_NUM_PARALLEL=4).
services:
  ollama:
    profiles: [disabled]        # never started
  hindsight:
    depends_on: !override
      postgres: { condition: service_healthy }
    extra_hosts: ["host.docker.internal:host-gateway"]
