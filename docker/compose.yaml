# Agent context stack: memory (Hindsight) + documents (LightRAG) + code (Sourcebot, CodeGraphContext)
# Docker Compose is the dev/single-box path; k8s/ is the same stack for k3s/Kubernetes. GPU: add -f compose.gpu.yaml.
# Inference backend: Ollama in this project (default), Ollama on the host (-f compose.host-ollama.yaml), or an
# OpenAI-compatible endpoint your organisation controls (LLM_PROVIDER=openai in config/stack.env). See README "What the model sees".
#
#   cp config/stack.env.example config/stack.env && edit
#   make gen && make up            (Makefile = docker compose -f docker/compose.yaml -f docker/compose.scopes.yaml
#                                   with COMPOSE_ENV_FILES pointing at config/stack.env; paths here are relative to docker/)
# Agents connect ONLY through the gateway (8090, behind SSO proxy). Direct engine ports are for admins.
# All published ports are bound to 127.0.0.1: gateway 8090, Hindsight 8888 / UI 9999, Sourcebot 3000, ingest 8080.
# Only the SSO proxy (or an admin on the host) reaches them; put the proxy on the same host or on the compose network.

name: agent-context-stack

services:

  # ------------------------------------------------------------------ shared
  postgres:
    image: docker.io/pgvector/pgvector:0.8.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 512m

  ollama:
    image: docker.io/ollama/ollama:0.33.3
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 2
    # CPU-only by default; see compose.gpu.yaml for NVIDIA.
    ports:
      - "127.0.0.1:11434:11434"

  redis:
    image: docker.io/redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis:/data

  # ------------------------------------------------------------------ memory
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.9.2
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_started }
    shm_size: 1g
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/hindsight
      # LLM: ollama (root URL) or openai (any OpenAI-compatible /v1 endpoint the org controls)
      HINDSIGHT_API_LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      HINDSIGHT_API_LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      HINDSIGHT_API_LLM_MODEL: ${LLM_MODEL}
      HINDSIGHT_API_LLM_API_KEY: ${LLM_API_KEY:-ollama}     # must be non-empty even for Ollama
      HINDSIGHT_API_LLM_OLLAMA_NUM_CTX: "32768"
      # embeddings: Hindsight speaks the OpenAI embeddings API; for Ollama that is <root>/v1
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${HINDSIGHT_EMBED_BASE_URL:-http://ollama:11434/v1}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${EMBED_API_KEY:-ollama}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${EMBED_MODEL}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: ${EMBED_DIM}
      # reranker: "local" = cross-encoder weights fetched once from HuggingFace at first start, then offline;
      # "rrf" = pure rank fusion, no model download at all
      HINDSIGHT_API_RERANKER_PROVIDER: ${HINDSIGHT_RERANKER:-local}
      HINDSIGHT_API_WORKER_ID: hindsight-1       # stable id so in-flight tasks survive restarts
      # every REST/MCP call must carry "Authorization: Bearer $HINDSIGHT_API_KEY" -> only the gateway holds it
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY}
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_CP_ACCESS_KEY}
      HINDSIGHT_CP_DATAPLANE_API_URL: http://localhost:8888
      HINDSIGHT_CP_DATAPLANE_API_KEY: ${HINDSIGHT_API_KEY}
    ports:
      - "127.0.0.1:8888:8888"   # API + MCP (admin only; the gateway talks to it on the compose network)
      - "127.0.0.1:9999:9999"   # control plane UI (admin only)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  # ------------------------------------------------------------------ code: search
  sourcebot:
    image: ghcr.io/sourcebot-dev/sourcebot:v5.1.10
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      CONFIG_PATH: /config/config.json
      DATA_CACHE_DIR: /data
      SOURCEBOT_TELEMETRY_DISABLED: "true"      # PostHog product telemetry is on by default
      # "service ping": periodic POST of org stats to deployments.sourcebot.dev, NOT covered by the flag above.
      # Point it at an unroutable address; only paid/online licences need it.
      SOURCEBOT_LIGHTHOUSE_URL: http://127.0.0.1:9
      AUTH_URL: ${SOURCEBOT_AUTH_URL}
      AUTH_SECRET: ${SOURCEBOT_AUTH_SECRET}
      SOURCEBOT_ENCRYPTION_KEY: ${SOURCEBOT_ENCRYPTION_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sourcebot
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ../config/sourcebot/config.json:/config/config.json:ro
      - sourcebot:/data
    ports:
      - "127.0.0.1:3000:3000"   # UI (create the API key here), search API, MCP -- admin only

  # ------------------------------------------------------------------ ingest (Confluence / Backstage / Git docs -> LightRAG)
  ingest:
    build: ../ingest
    restart: unless-stopped
    environment:
      SCOPES_FILE: /config/scopes.yaml
      LIGHTRAG_URL_TEMPLATE: http://lightrag-{scope}:9621
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      CONFLUENCE_URL: ${CONFLUENCE_URL}
      CONFLUENCE_USER: ${CONFLUENCE_USER}
      CONFLUENCE_TOKEN: ${CONFLUENCE_TOKEN}
      BACKSTAGE_URL: ${BACKSTAGE_URL}
      BACKSTAGE_TOKEN: ${BACKSTAGE_TOKEN}
      GIT_DOC_GLOBS: ${GIT_DOC_GLOBS}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      INGEST_WEBHOOK_SECRET: ${INGEST_WEBHOOK_SECRET}
      INGEST_SCHEDULE_CRON: ${INGEST_SCHEDULE_CRON}
      STATE_DIR: /state
      INGEST_PLUGINS_DIR: /plugins
    volumes:
      - ingest_state:/state
      - ../config/scopes.yaml:/config/scopes.yaml:ro
      - ../plugins:/plugins:ro            # drop-in source adapters (plugins/README.md)
    ports:
      - "127.0.0.1:8080:8080"   # POST /webhook/{confluence|backstage|git}, POST /sync/{source}, GET /health

  # ------------------------------------------------------------------ MCP gateway (the ONLY endpoint agents use)
  # Enforces scopes per caller. Must sit behind an SSO reverse proxy that sets X-Forwarded-User / X-Forwarded-Groups;
  # never publish 8090 beyond the proxy. See docs/ACCESS-CONTROL.md.
  gateway:
    build: ../mcp/gateway
    restart: unless-stopped
    depends_on:
      hindsight: { condition: service_started }
      sourcebot: { condition: service_started }
    environment:
      SCOPES_FILE: /config/scopes.yaml
      HINDSIGHT_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY}
      SOURCEBOT_URL: http://sourcebot:3000
      SOURCEBOT_API_KEY: ${SOURCEBOT_API_KEY}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      PORT: 8090
    volumes:
      - ../config/scopes.yaml:/config/scopes.yaml:ro
    ports:
      - "127.0.0.1:8090:8090"   # loopback only: the SSO proxy fronts it

volumes:
  pgdata:
  ollama:
  redis:
  sourcebot:
  ingest_state:
