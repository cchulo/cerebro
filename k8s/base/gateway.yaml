# The only endpoint agents use. Expose it ONLY through the SSO reverse proxy / Ingress that sets
# X-Forwarded-User and X-Forwarded-Groups (docs/ACCESS-CONTROL.md). ClusterIP here; no NodePort, no public Ingress.
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  selector: { app: gateway }
  ports: [{ port: 8090, targetPort: 8090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: agent-context-stack-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: stack-env } }]   # HINDSIGHT_API_KEY, SOURCEBOT_API_KEY, LIGHTRAG_API_KEY
          env:
            - { name: SCOPES_FILE, value: /config/scopes.yaml }
            - { name: HINDSIGHT_URL, value: http://hindsight:8888 }
            - { name: SOURCEBOT_URL, value: http://sourcebot:3000 }
            - { name: PORT, value: "8090" }
          ports: [{ containerPort: 8090 }]
          volumeMounts: [{ name: scopes, mountPath: /config, readOnly: true }]
      volumes:
        - name: scopes
          configMap: { name: scopes-config }
