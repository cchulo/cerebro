apiVersion: v1
kind: Service
metadata: { name: hindsight }
spec:
  selector: { app: hindsight }
  ports:
    - { name: api, port: 8888, targetPort: 8888 }
    - { name: ui, port: 9999, targetPort: 9999 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hindsight }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: hindsight } }
  template:
    metadata: { labels: { app: hindsight } }
    spec:
      # Hindsight runs migrations at startup and exits if Postgres is not up yet; wait instead of crash-looping.
      initContainers:
        - name: wait-for-postgres
          image: docker.io/pgvector/pgvector:0.8.2-pg17
          envFrom: [{ secretRef: { name: stack-env } }]
          command: ["sh", "-c", "until pg_isready -h postgres -U \"$POSTGRES_USER\"; do sleep 2; done"]
      containers:
        - name: hindsight
          image: ghcr.io/vectorize-io/hindsight:0.9.2
          envFrom: [{ secretRef: { name: stack-env } }]   # HINDSIGHT_API_* derived names come from stack-env
          env:
            - { name: HINDSIGHT_API_LLM_OLLAMA_NUM_CTX, value: "32768" }
            - { name: HINDSIGHT_API_EMBEDDINGS_PROVIDER, value: openai }
            - { name: HINDSIGHT_API_TENANT_EXTENSION, value: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension" }
            - { name: HINDSIGHT_API_WORKER_ID, value: hindsight-1 }
            - { name: HINDSIGHT_CP_DATAPLANE_API_URL, value: http://localhost:8888 }
          ports: [{ containerPort: 8888 }, { containerPort: 9999 }]
          volumeMounts: [{ name: shm, mountPath: /dev/shm }]
          readinessProbe:
            httpGet: { path: /health, port: 8888 }
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
