[project]
name = "cerebro"
version = "0.2.0"
description = "Self-hosted context gateway for AI agents: documents, code and memory behind one MCP endpoint, every engine a plugin"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
# the MCP gateway (identity adapters, tools, fan-out)
gateway = ["mcp>=1.10,<2", "uvicorn>=0.30", "starlette>=0.37", "PyJWT[crypto]>=2.9"]
# the ingest service (sync engine, scheduler, Postgres sync state, HTML sources)
ingest = ["fastapi>=0.110", "uvicorn>=0.30", "apscheduler>=3.10,<4", "psycopg[binary]>=3.1", "markdownify>=0.13"]
# the Kubernetes provisioner (kopf operator + API client)
kubernetes = ["kopf>=1.37", "kubernetes>=29"]
# the pgvector docs adapter
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "jsonschema>=4", "mcp>=1.10,<2"]
all = ["cerebro[gateway,ingest,kubernetes,pgvector,dev]"]

[project.scripts]
cerebro = "cerebro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cerebro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
