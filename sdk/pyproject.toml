[project]
name = "stack-plugins"
version = "0.1.0"
description = "Plugin framework for the agent context stack: ingest sources, live fallbacks, MCP upstream declarations"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["stack_plugins*"]
