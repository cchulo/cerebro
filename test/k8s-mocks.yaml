apiVersion: v1
kind: Service
metadata: { name: mock-confluence }
spec: { selector: { app: mock-confluence }, ports: [{ port: 8000, targetPort: 8000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mock-confluence }
spec:
  replicas: 1
  selector: { matchLabels: { app: mock-confluence } }
  template:
    metadata: { labels: { app: mock-confluence } }
    spec:
      containers:
        - name: mock
          image: agent-context-stack-mock-confluence:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: MOCK, value: confluence }]
          ports: [{ containerPort: 8000 }]
          volumeMounts: [{ name: fixtures, mountPath: /fixtures, readOnly: true }]
      volumes: [{ name: fixtures, configMap: { name: mock-fixtures } }]
---
